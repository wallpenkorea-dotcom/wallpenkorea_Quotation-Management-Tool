<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Museum Wall & Spot Lighting Gradients -->
    <radialGradient id="gallerySpot" cx="72%" cy="18%" r="85%">
      <stop offset="0%" stop-color="#dedad2" />
      <stop offset="25%" stop-color="#b8b4ab" />
      <stop offset="55%" stop-color="#73716a" />
      <stop offset="85%" stop-color="#3d3d3a" />
      <stop offset="100%" stop-color="#181817" />
    </radialGradient>

    <!-- Dark Museum Floor Gradient -->
    <linearGradient id="museumFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2d30" />
      <stop offset="20%" stop-color="#1f2023" />
      <stop offset="60%" stop-color="#141517" />
      <stop offset="100%" stop-color="#0b0b0c" />
    </linearGradient>

    <!-- Corridor Ambient Light -->
    <linearGradient id="corridorLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2d33" />
      <stop offset="40%" stop-color="#555a64" />
      <stop offset="70%" stop-color="#8c93a0" />
      <stop offset="100%" stop-color="#a8b0bd" />
    </linearGradient>

    <linearGradient id="corridorFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4f58" />
      <stop offset="100%" stop-color="#22252a" />
    </linearGradient>

    <!-- Machine Mast & Aluminum Texture -->
    <linearGradient id="mastSilver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#606670" />
      <stop offset="20%" stop-color="#cfd5df" />
      <stop offset="60%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#b4bcc8" />
      <stop offset="100%" stop-color="#525862" />
    </linearGradient>

    <!-- Machine Dark Base Chassis -->
    <linearGradient id="chassisDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#383d45" />
      <stop offset="40%" stop-color="#23272e" />
      <stop offset="100%" stop-color="#131518" />
    </linearGradient>

    <!-- Printhead Carriage Module -->
    <linearGradient id="carriageMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5059" />
      <stop offset="50%" stop-color="#2a2e34" />
      <stop offset="100%" stop-color="#16181b" />
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="wallShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <filter id="logoShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- ============================================================ -->
  <!-- 1. Background Exhibition Wall & Lighting                     -->
  <!-- ============================================================ -->
  <rect width="1920" height="1080" fill="url(#gallerySpot)" />

  <!-- Exhibition Corridor / Doorway on Right -->
  <g id="gallery-corridor">
    <!-- Doorway frame cut -->
    <path d="M 1560 205 L 1820 250 L 1820 780 L 1560 780 Z" fill="#1b1c1e" />
    <!-- Distant Corridor Wall -->
    <path d="M 1565 210 L 1815 255 L 1815 760 L 1565 760 Z" fill="url(#corridorLight)" />
    <!-- Distant ceiling spotlight cone -->
    <polygon points="1700,230 1620,760 1780,760" fill="#ffffff" opacity="0.15" />
    <!-- Blue Interactive Screen Display -->
    <g transform="translate(1595, 480) rotate(22)">
      <rect x="0" y="0" width="110" height="75" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="3" />
      <rect x="5" y="5" width="100" height="65" rx="3" fill="#094578" />
      <ellipse cx="35" cy="37" rx="16" ry="24" fill="none" stroke="#58a6ff" stroke-width="5" />
      <ellipse cx="65" cy="37" rx="16" ry="24" fill="none" stroke="#58a6ff" stroke-width="5" />
    </g>
    <!-- Distant Signboard 'SC-08' -->
    <rect x="1815" y="410" width="40" height="24" rx="2" fill="#d0d7de" />
    <text x="1835" y="426" font-family="monospace" font-size="9" font-weight="bold" fill="#cf222e" text-anchor="middle">SC-08</text>
    <!-- Orange Crate on Floor in Distance -->
    <rect x="1815" y="530" width="65" height="42" rx="3" fill="#d97706" stroke="#b45309" stroke-width="2" />
    <line x1="1825" y1="530" x2="1825" y2="572" stroke="#92400e" stroke-width="2" />
    <line x1="1845" y1="530" x2="1845" y2="572" stroke="#92400e" stroke-width="2" />
    <line x1="1865" y1="530" x2="1865" y2="572" stroke="#92400e" stroke-width="2" />
  </g>

  <!-- Museum Wall Right Edge Wall Pillar -->
  <polygon points="1750,0 1920,0 1920,1080 1780,1080" fill="#121315" />
  <polygon points="1750,0 1780,0 1800,1080 1780,1080" fill="#2d3036" opacity="0.6" />

  <!-- Floor Base & Baseboard -->
  <path d="M 0 940 L 1920 780 L 1920 1080 L 0 1080 Z" fill="url(#museumFloor)" />
  <path d="M 0 938 L 1920 778 L 1920 786 L 0 946 Z" fill="#0f1012" />

  <!-- ============================================================ -->
  <!-- 2. Authentic Museum Wall Print Graphics (Sapiens Exhibit)    -->
  <!-- ============================================================ -->
  <g id="museum-wall-text-and-map" fill="#35373b" opacity="0.78">
    <!-- Top Heading -->
    <text x="740" y="150" font-family="'Noto Sans KR', 'Pretendard', sans-serif" font-size="25" font-weight="600" letter-spacing="4" fill="#2e3034">
      사피엔스의 대이동
    </text>

    <!-- Left Darwin Quote -->
    <g transform="translate(260, 310)" font-family="'Noto Serif KR', 'Nanum Myeongjo', serif">
      <text x="0" y="0" font-size="28" font-weight="700" fill="#25272a" letter-spacing="0.5">환경 변화가 일어날 때,</text>
      <text x="0" y="44" font-size="28" font-weight="700" fill="#25272a" letter-spacing="0.5">그 환경에 적합한 개체들만이 생존할 것이다.</text>
      
      <text x="0" y="105" font-family="'Georgia', serif" font-size="21" fill="#3d4046" font-style="normal">When environmental changes occur,</text>
      <text x="0" y="136" font-family="'Georgia', serif" font-size="21" fill="#3d4046" font-style="normal">the individuals most suited to the new environment will survive.</text>
      
      <text x="240" y="200" font-size="14" fill="#52565e">찰스 다윈, 『종의 기원』 4장 [자연 선택] 개작</text>
      <text x="240" y="222" font-family="'Georgia', serif" font-size="12" fill="#666b74">Adapted from The Origin of Species Chapter 4 [Natural Selection]</text>
      <text x="240" y="240" font-family="'Georgia', serif" font-size="12" fill="#666b74">Charles Darwin</text>
    </g>

    <!-- World Map Migration Flow (Routes, Curves & Labels) -->
    <g transform="translate(850, 260)" stroke="#45484f" stroke-width="1.8" fill="none">
      <!-- Soft continent silhouette contours -->
      <path d="M 50,110 Q 120,40 220,50 T 400,60" opacity="0.4" stroke-dasharray="3,3" />
      <path d="M 0,220 Q 80,180 140,240 T 110,400 Q 50,420 0,350 Z" opacity="0.4" stroke-width="1.2" />
      <path d="M 120,80 Q 200,60 260,110 Q 320,180 280,240" opacity="0.4" stroke-width="1.2" />
      <path d="M 380,380 Q 440,360 480,420 T 420,480 Z" opacity="0.4" stroke-width="1.2" />
      
      <!-- Migration Arrows -->
      <path d="M 80,310 C 130,260 160,200 200,160" stroke-width="4" stroke="#3b3e44" />
      <path d="M 200,160 C 270,120 380,100 520,160" stroke-width="3" stroke="#3b3e44" />
      <path d="M 200,160 C 260,240 340,320 400,380" stroke-width="3.5" stroke="#3b3e44" />
      <path d="M 520,160 C 580,200 620,260 640,340" stroke-width="2.5" stroke="#3b3e44" stroke-dasharray="6,4" />

      <!-- Route Node Circles & Text Badges -->
      <g stroke="none" fill="#44474e">
        <!-- Node 1: Africa -->
        <circle cx="80" cy="310" r="14" fill="#303238" />
        <text x="80" y="315" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
        <rect x="100" y="300" width="82" height="20" rx="10" fill="none" stroke="#44474e" stroke-width="1" />
        <text x="141" y="314" font-family="sans-serif" font-size="10.5" fill="#383a40" text-anchor="middle">200,000년 전</text>

        <!-- Node 2 -->
        <circle cx="200" cy="160" r="14" fill="#303238" />
        <text x="200" y="165" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
        <rect x="220" y="150" width="115" height="20" rx="10" fill="none" stroke="#44474e" stroke-width="1" />
        <text x="277" y="164" font-family="sans-serif" font-size="10.5" fill="#383a40" text-anchor="middle">70,000년~50,000년 전</text>

        <!-- Node 4: Europe -->
        <circle cx="45" cy="65" r="12" fill="#303238" />
        <text x="45" y="70" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
        <rect x="-3" y="85" width="96" height="18" rx="9" fill="none" stroke="#44474e" stroke-width="1" />
        <text x="45" y="98" font-family="sans-serif" font-size="10" fill="#383a40" text-anchor="middle">45,000년~35,000년 전</text>

        <!-- Node 5: Asia -->
        <circle cx="360" cy="140" r="12" fill="#303238" />
        <text x="360" y="145" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
        <rect x="375" y="132" width="96" height="18" rx="9" fill="none" stroke="#44474e" stroke-width="1" />
        <text x="423" y="145" font-family="sans-serif" font-size="10" fill="#383a40" text-anchor="middle">45,000년~35,000년 전</text>

        <!-- Node 8: Oceania -->
        <circle cx="380" cy="365" r="12" fill="#303238" />
        <text x="380" y="370" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
        <rect x="396" y="357" width="65" height="18" rx="9" fill="none" stroke="#44474e" stroke-width="1" />
        <text x="428" y="370" font-family="sans-serif" font-size="10" fill="#383a40" text-anchor="middle">5,000년 전</text>

        <!-- Geographic Labels -->
        <text x="45" y="50" font-family="'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#2d3036">유럽</text>
        <text x="10" y="245" font-family="'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#2d3036">아프리카</text>
        <text x="300" y="90" font-family="'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#2d3036">아시아</text>
        <text x="420" y="440" font-family="'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#2d3036">호주</text>
        <text x="380" y="580" font-family="'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#2d3036">남극</text>
        <text x="440" y="20" font-family="'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#2d3036">북극해</text>
        <text x="560" y="110" font-family="'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#2d3036">북아메리카</text>
      </g>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- 3. REALISTIC WALLPEN MACHINE HARDWARE RIG                   -->
  <!-- ============================================================ -->
  <g id="wallpen-vertical-machine">
    <!-- Machine Floor Shadow -->
    <ellipse cx="1480" cy="980" rx="280" ry="45" fill="#000000" opacity="0.85" filter="url(#wallShadow)" />
    <ellipse cx="1510" cy="990" rx="160" ry="25" fill="#000000" opacity="0.95" filter="url(#contactShadow)" />

    <!-- 3.1 Vertical Aluminum Rail Mast (Extending to Ceiling) -->
    <g id="vertical-mast">
      <!-- Main Extruded Profile -->
      <rect x="1295" y="0" width="82" height="740" fill="url(#mastSilver)" stroke="#383e47" stroke-width="2" />
      <!-- Center T-Slot Guide Track -->
      <rect x="1330" y="0" width="12" height="740" fill="#1e2126" />
      <line x1="1336" y1="0" x2="1336" y2="740" stroke="#7a828e" stroke-width="1.5" />
      <!-- Left & Right Chamfer Highlights -->
      <line x1="1302" y1="0" x2="1302" y2="740" stroke="#ffffff" stroke-width="2" opacity="0.8" />
      <line x1="1370" y1="0" x2="1370" y2="740" stroke="#2a2e36" stroke-width="2" />
      
      <!-- Mast Vertical Branding 'wallPen' -->
      <g transform="translate(1348, 290) rotate(90)">
        <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#2c3038" letter-spacing="1">wallPen</text>
      </g>
    </g>

    <!-- 3.2 Printhead Carriage Unit (Mounted on Mast) -->
    <g id="printhead-carriage">
      <!-- Horizontal Extension Arm -->
      <rect x="1150" y="380" width="220" height="95" rx="8" fill="url(#carriageMetal)" stroke="#505763" stroke-width="2.5" />
      
      <!-- Top UV Lamp Heat Sinks / Optics Box -->
      <rect x="1190" y="362" width="130" height="22" rx="4" fill="#1b1d22" stroke="#434852" stroke-width="1.5" />
      <line x1="1205" y1="365" x2="1205" y2="380" stroke="#788290" stroke-width="2" />
      <line x1="1225" y1="365" x2="1225" y2="380" stroke="#788290" stroke-width="2" />
      <line x1="1245" y1="365" x2="1245" y2="380" stroke="#788290" stroke-width="2" />
      <line x1="1265" y1="365" x2="1265" y2="380" stroke="#788290" stroke-width="2" />
      <line x1="1285" y1="365" x2="1285" y2="380" stroke="#788290" stroke-width="2" />
      <line x1="1305" y1="365" x2="1305" y2="380" stroke="#788290" stroke-width="2" />

      <!-- Print Head Nozzle Guard Plate (Left Facing Wall) -->
      <rect x="1142" y="395" width="12" height="68" rx="2" fill="#0f1114" stroke="#d0d7de" stroke-width="1" />
      <!-- Status LEDs & Connectors -->
      <circle cx="1165" cy="400" r="4" fill="#ef4444" />
      <circle cx="1165" cy="415" r="4" fill="#22c55e" />
      <circle cx="1165" cy="430" r="4" fill="#3b82f6" />
      
      <!-- Cable Arm Connector -->
      <rect x="1360" y="360" width="130" height="34" rx="4" fill="#22252a" stroke="#484f5a" stroke-width="1.5" />
      <rect x="1455" y="365" width="22" height="24" rx="2" fill="#ef4444" />
    </g>

    <!-- 3.3 Flexible Black Corrugated Cable Conduit / Hose -->
    <path d="M 1475 385 C 1580 400, 1580 620, 1500 700" fill="none" stroke="#121316" stroke-width="24" stroke-linecap="round" />
    <!-- Spiral Ring Details on Cable -->
    <path d="M 1475 385 C 1580 400, 1580 620, 1500 700" fill="none" stroke="#2e333b" stroke-width="20" stroke-linecap="round" stroke-dasharray="5,6" />

    <!-- 3.4 Lower Chassis / Wheel Base Unit -->
    <g id="base-unit">
      <!-- Main Upright Chassis Housing -->
      <rect x="1375" y="650" width="190" height="330" rx="10" fill="url(#chassisDark)" stroke="#454c57" stroke-width="2.5" />
      
      <!-- Top Vented Grille Section -->
      <g fill="#0e1012">
        <rect x="1395" y="670" width="150" height="42" rx="4" />
        <!-- Louver Slits -->
        <line x1="1405" y1="680" x2="1535" y2="680" stroke="#282c34" stroke-width="2.5" />
        <line x1="1405" y1="690" x2="1535" y2="690" stroke="#282c34" stroke-width="2.5" />
        <line x1="1405" y1="700" x2="1535" y2="700" stroke="#282c34" stroke-width="2.5" />
      </g>

      <!-- Industrial Safety Warning Stickers -->
      <g transform="translate(1435, 638)">
        <!-- Triangle Hazard Sign -->
        <polygon points="12,0 0,20 24,20" fill="#facc15" stroke="#000000" stroke-width="1.5" />
        <text x="12" y="17" font-family="sans-serif" font-size="12" font-weight="900" fill="#000000" text-anchor="middle">!</text>
        
        <!-- Blue Mandatory Eye Protection -->
        <circle cx="38" cy="10" r="10" fill="#2563eb" stroke="#ffffff" stroke-width="1" />
        <circle cx="38" cy="10" r="6" fill="none" stroke="#ffffff" stroke-width="2" />
        
        <!-- Red Laser Warning Circle -->
        <circle cx="62" cy="10" r="10" fill="#ef4444" stroke="#ffffff" stroke-width="1" />
        <polygon points="62,3 55,16 69,16" fill="#facc15" />
        
        <!-- Blue Ear Protection -->
        <circle cx="86" cy="10" r="10" fill="#2563eb" stroke="#ffffff" stroke-width="1" />
      </g>

      <!-- Embossed Brand Wordmark 'wallPen' on Chassis Front -->
      <text x="1470" y="780" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="30" fill="#22252a" text-anchor="middle" letter-spacing="-0.5">
        wallPen
      </text>
      <!-- Highlight Reflection Line -->
      <text x="1470" y="779" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="30" fill="#4d5563" text-anchor="middle" letter-spacing="-0.5" opacity="0.35">
        wallPen
      </text>

      <!-- Yellow Inspection QC Badge -->
      <rect x="1515" y="900" width="22" height="22" rx="4" fill="#eab308" stroke="#ca8a04" stroke-width="1" />
      <text x="1526" y="915" font-family="sans-serif" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">VIP</text>

      <!-- Wheeled Floor Track Base Outriggers -->
      <path d="M 1340 960 L 1610 940 L 1630 990 L 1330 1010 Z" fill="#181a1e" stroke="#363c46" stroke-width="3" />
      <!-- Precision Steel Guide Track Wheels -->
      <rect x="1335" y="980" width="45" height="30" rx="8" fill="#47505d" stroke="#22262d" stroke-width="2" />
      <rect x="1575" y="960" width="45" height="30" rx="8" fill="#47505d" stroke="#22262d" stroke-width="2" />
    </g>
  </g>

  <!-- Ambient Dark Cinema Vignette & Studio Lighting Layer -->
  <radialGradient id="stageVignette" cx="48%" cy="48%" r="65%">
    <stop offset="0%" stop-color="#000000" stop-opacity="0.15" />
    <stop offset="60%" stop-color="#000000" stop-opacity="0.40" />
    <stop offset="100%" stop-color="#000000" stop-opacity="0.80" />
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#stageVignette)" />

  <!-- ============================================================ -->
  <!-- 4. CENTER EXACT WHITE BRAND OVERLAY: wallPen KOREA          -->
  <!-- ============================================================ -->
  <g transform="translate(960, 510)" text-anchor="middle" filter="url(#logoShadow)">
    <!-- Main Big Wordmark 'wallPen' -->
    <text x="0" y="0" 
          font-family="'Plus Jakarta Sans', 'Montserrat', -apple-system, sans-serif" 
          font-weight="900" 
          font-size="190" 
          fill="#ffffff" 
          letter-spacing="-2.5">
      wallPen
    </text>

    <!-- Spaced 'K O R E A' -->
    <text x="0" y="110" 
          font-family="'Plus Jakarta Sans', 'Arial', sans-serif" 
          font-weight="800" 
          font-size="44" 
          fill="#ffffff" 
          letter-spacing="30">
      K O R E A
    </text>

    <!-- Subtitle '벽면 프린트 서비스 / 장비판매' -->
    <text x="0" y="180" 
          font-family="'Pretendard', 'Noto Sans KR', sans-serif" 
          font-weight="700" 
          font-size="34" 
          fill="#ffffff" 
          letter-spacing="3.5">
      벽면 프린트 서비스 / 장비판매
    </text>
  </g>
</svg>

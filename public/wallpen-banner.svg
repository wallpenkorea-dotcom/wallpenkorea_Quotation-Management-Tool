<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Photorealistic Studio Gradients -->
    <radialGradient id="studioLighting" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#6e7480" />
      <stop offset="20%" stop-color="#505661" />
      <stop offset="45%" stop-color="#31363e" />
      <stop offset="70%" stop-color="#1c1f24" />
      <stop offset="100%" stop-color="#0d0f12" />
    </radialGradient>

    <linearGradient id="studioFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242830" />
      <stop offset="25%" stop-color="#2d323c" />
      <stop offset="50%" stop-color="#20242b" />
      <stop offset="85%" stop-color="#14171c" />
      <stop offset="100%" stop-color="#0a0c0e" />
    </linearGradient>

    <!-- Nylon Fabric Textures & Lighting -->
    <linearGradient id="nylonLight" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#555c69" />
      <stop offset="30%" stop-color="#3d434d" />
      <stop offset="70%" stop-color="#282c34" />
      <stop offset="100%" stop-color="#181a1f" />
    </linearGradient>

    <linearGradient id="nylonMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#464c57" />
      <stop offset="40%" stop-color="#323740" />
      <stop offset="100%" stop-color="#1a1d22" />
    </linearGradient>

    <linearGradient id="nylonDark" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#373d47" />
      <stop offset="50%" stop-color="#252930" />
      <stop offset="100%" stop-color="#121417" />
    </linearGradient>

    <linearGradient id="strapWebbing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0b0d" />
      <stop offset="35%" stop-color="#262a32" />
      <stop offset="65%" stop-color="#1c1f25" />
      <stop offset="100%" stop-color="#08090b" />
    </linearGradient>

    <linearGradient id="metalPiping" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a8494" />
      <stop offset="50%" stop-color="#444b56" />
      <stop offset="100%" stop-color="#1e2229" />
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" />
    </filter>
    <filter id="contactShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Studio Background Wall -->
  <rect width="1280" height="720" fill="url(#studioLighting)" />

  <!-- Studio Light Floor -->
  <path d="M 0 520 L 1280 520 L 1280 720 L 0 720 Z" fill="url(#studioFloor)" />
  <line x1="0" y1="520" x2="1280" y2="520" stroke="#3d4450" stroke-width="1.5" opacity="0.6" />

  <!-- Floor Contact & Ambient Diffuse Shadows -->
  <ellipse cx="640" cy="570" rx="580" ry="85" fill="#000000" opacity="0.75" filter="url(#softShadow)" />
  <ellipse cx="440" cy="575" rx="260" ry="35" fill="#000000" opacity="0.9" filter="url(#contactShadow)" />
  <ellipse cx="820" cy="580" rx="300" ry="35" fill="#000000" opacity="0.85" filter="url(#contactShadow)" />
  <ellipse cx="230" cy="590" rx="180" ry="30" fill="#000000" opacity="0.9" filter="url(#contactShadow)" />

  <!-- ============================================================ -->
  <!-- 1. Background Standing Tall Center-Left Equipment Bag        -->
  <!-- ============================================================ -->
  <g id="bg-tall-case">
    <!-- Shadow -->
    <ellipse cx="440" cy="565" rx="190" ry="25" fill="#000000" opacity="0.6" filter="url(#contactShadow)" />
    <!-- Main Body -->
    <rect x="275" y="150" width="330" height="415" rx="14" fill="url(#nylonMid)" stroke="#4e5666" stroke-width="2.5" />
    <!-- Top Zipper Cap -->
    <rect x="273" y="150" width="334" height="28" rx="8" fill="#20242c" stroke="#5a6373" stroke-width="1.5" />
    <line x1="275" y1="178" x2="605" y2="178" stroke="#0e1013" stroke-width="4" />
    <!-- Webbing Straps -->
    <rect x="365" y="150" width="34" height="415" fill="url(#strapWebbing)" />
    <rect x="495" y="150" width="34" height="415" fill="url(#strapWebbing)" />
    <!-- Top Carry Handle Loop -->
    <path d="M 382 150 C 382 60, 512 60, 512 150" fill="none" stroke="#121418" stroke-width="28" stroke-linecap="round" />
    <path d="M 382 150 C 382 68, 512 68, 512 150" fill="none" stroke="#3a404c" stroke-width="8" stroke-linecap="round" opacity="0.6" />
    <!-- Side wallPen Rubber Patch -->
    <g transform="translate(448, 460) rotate(-90)">
      <rect x="-55" y="-16" width="110" height="32" rx="16" fill="#131519" stroke="#48505e" stroke-width="2" />
      <text x="0" y="5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="16" fill="#757d8c" text-anchor="middle">wallPen</text>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- 2. Background Standing Duffel / Trunk (Right)                -->
  <!-- ============================================================ -->
  <g id="bg-right-trunk">
    <!-- Main Body -->
    <rect x="580" y="320" width="490" height="250" rx="14" fill="url(#nylonDark)" stroke="#444b58" stroke-width="2.5" />
    <rect x="578" y="320" width="494" height="26" rx="8" fill="#1e2229" stroke="#505868" stroke-width="1.5" />
    <line x1="580" y1="346" x2="1070" y2="346" stroke="#0e1013" stroke-width="4" />
    <!-- Webbing Straps -->
    <rect x="710" y="320" width="32" height="250" fill="url(#strapWebbing)" />
    <rect x="940" y="320" width="32" height="250" fill="url(#strapWebbing)" />
    <!-- Handle -->
    <path d="M 726 320 C 726 215, 876 215, 876 320" fill="none" stroke="#121418" stroke-width="26" stroke-linecap="round" />
    <path d="M 726 320 C 726 222, 876 222, 876 320" fill="none" stroke="#363c47" stroke-width="8" stroke-linecap="round" opacity="0.6" />
    <!-- Patch -->
    <g transform="translate(1010, 460) rotate(-90)">
      <rect x="-50" y="-15" width="100" height="30" rx="15" fill="#111317" stroke="#3d4452" stroke-width="2" />
      <text x="0" y="5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="15" fill="#68707f" text-anchor="middle">wallPen</text>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- 3. Foreground Left Rectangular Gear Case                     -->
  <!-- ============================================================ -->
  <g id="fg-left-case">
    <!-- Body -->
    <rect x="120" y="360" width="280" height="260" rx="16" fill="url(#nylonLight)" stroke="#626b7a" stroke-width="3" />
    <rect x="118" y="360" width="284" height="32" rx="10" fill="#2d333d" stroke="#687384" stroke-width="1.5" />
    <line x1="120" y1="392" x2="400" y2="392" stroke="#101216" stroke-width="5" />
    <!-- Straps -->
    <rect x="185" y="360" width="28" height="260" fill="url(#strapWebbing)" />
    <rect x="305" y="360" width="28" height="260" fill="url(#strapWebbing)" />
    <!-- Top Carry Handle -->
    <path d="M 199 360 C 199 265, 319 265, 319 360" fill="none" stroke="#13161a" stroke-width="24" stroke-linecap="round" />
    <path d="M 199 360 C 199 272, 319 272, 319 360" fill="none" stroke="#48505e" stroke-width="7" stroke-linecap="round" opacity="0.6" />
    <!-- Metallic Strap D-Ring on Side -->
    <path d="M 112 450 C 112 468, 128 468, 128 450 Z" fill="none" stroke="#8892a4" stroke-width="4.5" />
    <line x1="108" y1="475" x2="120" y2="440" stroke="#121519" stroke-width="16" stroke-linecap="round" />
    <!-- Front Logo Patch -->
    <g transform="translate(345, 505) rotate(-90)">
      <rect x="-55" y="-18" width="110" height="36" rx="18" fill="#131519" stroke="#5a6375" stroke-width="2" />
      <text x="0" y="6" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="17" fill="#9ba4b5" text-anchor="middle">wallPen</text>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- 4. Foreground Center-Right Duffel Bag                        -->
  <!-- ============================================================ -->
  <g id="fg-center-duffel">
    <!-- Body -->
    <rect x="490" y="410" width="370" height="215" rx="16" fill="url(#nylonLight)" stroke="#626b7a" stroke-width="3" />
    <rect x="488" y="410" width="374" height="28" rx="10" fill="#2d333d" stroke="#687384" stroke-width="1.5" />
    <line x1="490" y1="438" x2="860" y2="438" stroke="#101216" stroke-width="5" />
    <!-- Straps -->
    <rect x="575" y="410" width="28" height="215" fill="url(#strapWebbing)" />
    <rect x="740" y="410" width="28" height="215" fill="url(#strapWebbing)" />
    <!-- Carry Handles -->
    <path d="M 589 410 C 589 320, 754 320, 754 410" fill="none" stroke="#13161a" stroke-width="24" stroke-linecap="round" />
    <path d="M 589 410 C 589 328, 754 328, 754 410" fill="none" stroke="#48505e" stroke-width="7" stroke-linecap="round" opacity="0.6" />
    <!-- Logo Patch -->
    <g transform="translate(695, 530) rotate(-90)">
      <rect x="-55" y="-18" width="110" height="36" rx="18" fill="#131519" stroke="#5a6375" stroke-width="2" />
      <text x="0" y="6" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="17" fill="#9ba4b5" text-anchor="middle">wallPen</text>
    </g>
    <!-- Right side clip -->
    <path d="M 862 525 C 876 525, 876 542, 862 542" fill="none" stroke="#8892a4" stroke-width="4.5" />
  </g>

  <!-- Studio Vignette & Contrast Overlay -->
  <radialGradient id="photoVignette" cx="50%" cy="45%" r="55%">
    <stop offset="0%" stop-color="#000000" stop-opacity="0.25" />
    <stop offset="65%" stop-color="#000000" stop-opacity="0.45" />
    <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
  </radialGradient>
  <rect width="1280" height="720" fill="url(#photoVignette)" />

  <!-- ============================================================ -->
  <!-- CENTER EXACT BRAND GRAPHIC: wallPen KOREA                   -->
  <!-- ============================================================ -->
  <g transform="translate(640, 340)" text-anchor="middle" filter="url(#textGlow)">
    <!-- Wordmark text 'wallPen' -->
    <text x="0" y="0" 
          font-family="'Plus Jakarta Sans', 'Arial Black', -apple-system, sans-serif" 
          font-weight="900" 
          font-size="132" 
          fill="#ffffff" 
          letter-spacing="-1.5">
      wallPen
    </text>

    <!-- 'K O R E A' with exact letter spacing -->
    <text x="0" y="80" 
          font-family="'Plus Jakarta Sans', 'Arial', sans-serif" 
          font-weight="800" 
          font-size="34" 
          fill="#ffffff" 
          letter-spacing="20">
      K O R E A
    </text>

    <!-- '벽면 프린트 서비스 / 장비판매' Subtitle -->
    <text x="0" y="132" 
          font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif" 
          font-weight="700" 
          font-size="24" 
          fill="#f8fafc" 
          letter-spacing="2">
      벽면 프린트 서비스 / 장비판매
    </text>
  </g>
</svg>

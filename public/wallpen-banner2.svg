<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Studio Key Spotlight -->
    <radialGradient id="studioSpot" cx="48%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#5a606d" />
      <stop offset="22%" stop-color="#424752" />
      <stop offset="50%" stop-color="#2a2e36" />
      <stop offset="78%" stop-color="#181a1f" />
      <stop offset="100%" stop-color="#0e1013" />
    </radialGradient>

    <!-- Studio Floor Reflection & Gradient -->
    <linearGradient id="studioFloorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d323b" />
      <stop offset="30%" stop-color="#22262d" />
      <stop offset="70%" stop-color="#16181d" />
      <stop offset="100%" stop-color="#0c0d10" />
    </linearGradient>

    <!-- Ballistic Nylon Fabric 3D Gradients -->
    <linearGradient id="nylonHeroFront" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#636b78" />
      <stop offset="25%" stop-color="#484f5a" />
      <stop offset="65%" stop-color="#323740" />
      <stop offset="100%" stop-color="#1f2228" />
    </linearGradient>

    <linearGradient id="nylonHeroSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#23272e" />
      <stop offset="40%" stop-color="#1b1e23" />
      <stop offset="100%" stop-color="#101215" />
    </linearGradient>

    <linearGradient id="nylonHeroTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#555c68" />
      <stop offset="100%" stop-color="#2b2f37" />
    </linearGradient>

    <linearGradient id="nylonMidBag" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#4b525e" />
      <stop offset="35%" stop-color="#353b44" />
      <stop offset="80%" stop-color="#22262c" />
      <stop offset="100%" stop-color="#15171b" />
    </linearGradient>

    <linearGradient id="nylonBackBag" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#3b414b" />
      <stop offset="45%" stop-color="#262a31" />
      <stop offset="100%" stop-color="#131518" />
    </linearGradient>

    <!-- Heavy Duty Webbing Strap Gradients -->
    <linearGradient id="strapBlack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0c0e" />
      <stop offset="30%" stop-color="#2b3039" />
      <stop offset="70%" stop-color="#1d2026" />
      <stop offset="100%" stop-color="#090a0c" />
    </linearGradient>

    <linearGradient id="strapBlackH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0c0e" />
      <stop offset="35%" stop-color="#2d333d" />
      <stop offset="75%" stop-color="#1e2229" />
      <stop offset="100%" stop-color="#08090b" />
    </linearGradient>

    <!-- Metallic Buckles & D-Rings -->
    <linearGradient id="metalChrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9ca7b8" />
      <stop offset="40%" stop-color="#555e6c" />
      <stop offset="60%" stop-color="#cfd8e5" />
      <stop offset="100%" stop-color="#242830" />
    </linearGradient>

    <!-- Drop Shadows & Contact Occlusions -->
    <filter id="blurFloorShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" />
    </filter>
    <filter id="blurContactShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" />
    </filter>
    <filter id="logoCenterShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- ============================================================ -->
  <!-- 1. STUDIO WALL BACKGROUND & FLOOR                            -->
  <!-- ============================================================ -->
  <rect width="1920" height="1080" fill="url(#studioSpot)" />

  <!-- Studio Floor Plane with Horizon -->
  <path d="M 0 740 L 1920 740 L 1920 1080 L 0 1080 Z" fill="url(#studioFloorGrad)" />
  <line x1="0" y1="740" x2="1920" y2="740" stroke="#363c46" stroke-width="1.5" opacity="0.4" />

  <!-- Ground Ambient Diffuse Shadows -->
  <ellipse cx="960" cy="850" rx="900" ry="140" fill="#000000" opacity="0.70" filter="url(#blurFloorShadow)" />
  <ellipse cx="270" cy="890" rx="260" ry="50" fill="#000000" opacity="0.90" filter="url(#blurContactShadow)" />
  <ellipse cx="690" cy="810" rx="300" ry="45" fill="#000000" opacity="0.90" filter="url(#blurContactShadow)" />
  <ellipse cx="1180" cy="870" rx="280" ry="45" fill="#000000" opacity="0.88" filter="url(#blurContactShadow)" />
  <ellipse cx="1450" cy="830" rx="420" ry="55" fill="#000000" opacity="0.85" filter="url(#blurContactShadow)" />

  <!-- ============================================================ -->
  <!-- 2. EQUIPMENT BAGS (ARRANGEMENT MATCHING 유튜브 배경2.png)     -->
  <!-- ============================================================ -->

  <!-- [Bag 1] FAR LEFT REAR FLAT CASE -->
  <g id="bag-far-left-back">
    <path d="M 120 480 L 320 470 L 320 750 L 120 760 Z" fill="#1b1e24" stroke="#383e48" stroke-width="2" />
    <rect x="120" y="470" width="200" height="24" rx="4" fill="#292e37" stroke="#48505d" stroke-width="1.5" />
    <rect x="180" y="470" width="30" height="280" fill="url(#strapBlack)" />
  </g>

  <!-- [Bag 2] LARGE CENTER-LEFT STANDING CASE (TALL UPRIGHT) -->
  <g id="bag-center-tall">
    <!-- Top Carry Handle Loop -->
    <path d="M 580 230 C 580 110, 770 110, 770 230" fill="none" stroke="#121417" stroke-width="38" stroke-linecap="round" />
    <path d="M 580 230 C 580 120, 770 120, 770 230" fill="none" stroke="#373d49" stroke-width="12" stroke-linecap="round" opacity="0.7" />
    <!-- Main Box Body -->
    <rect x="420" y="215" width="560" height="545" rx="20" fill="url(#nylonBackBag)" stroke="#454c59" stroke-width="3" />
    <!-- Top Zipper Rim Lid -->
    <rect x="418" y="215" width="564" height="42" rx="12" fill="#20242c" stroke="#525c6b" stroke-width="2" />
    <line x1="420" y1="257" x2="980" y2="257" stroke="#0e1013" stroke-width="5" />
    <!-- Vertical Heavy Webbing Straps -->
    <rect x="560" y="215" width="46" height="545" fill="url(#strapBlack)" />
    <rect x="790" y="215" width="46" height="545" fill="url(#strapBlack)" />
    <!-- Handle Base Reinforcement Stitching Patches -->
    <rect x="555" y="235" width="56" height="60" rx="6" fill="#13161a" stroke="#3d4452" stroke-width="1.5" />
    <rect x="785" y="235" width="56" height="60" rx="6" fill="#13161a" stroke="#3d4452" stroke-width="1.5" />
    <!-- Center Lower Vertical 'wallPen' Rubber Badge -->
    <g transform="translate(680, 650) rotate(-90)">
      <rect x="-85" y="-24" width="170" height="48" rx="24" fill="#111317" stroke="#4a5260" stroke-width="3" />
      <rect x="-79" y="-18" width="158" height="36" rx="18" fill="#181b21" />
      <text x="0" y="8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="24" fill="#6d7687" text-anchor="middle" letter-spacing="-0.5">wallPen</text>
    </g>
  </g>

  <!-- [Bag 3] FAR RIGHT DUFFEL TRUNK -->
  <g id="bag-far-right">
    <!-- Top Handles -->
    <path d="M 1280 340 C 1280 200, 1540 200, 1540 340" fill="none" stroke="#121417" stroke-width="36" stroke-linecap="round" />
    <path d="M 1280 340 C 1280 210, 1540 210, 1540 340" fill="none" stroke="#363c48" stroke-width="10" stroke-linecap="round" opacity="0.6" />
    <!-- Duffel Body -->
    <rect x="1020" y="340" width="850" height="490" rx="22" fill="url(#nylonBackBag)" stroke="#454c59" stroke-width="3" />
    <rect x="1018" y="340" width="854" height="40" rx="12" fill="#1f232b" stroke="#4d5766" stroke-width="2" />
    <line x1="1020" y1="380" x2="1870" y2="380" stroke="#0e1013" stroke-width="5" />
    <!-- Vertical Straps -->
    <rect x="1260" y="340" width="46" height="490" fill="url(#strapBlack)" />
    <rect x="1620" y="340" width="46" height="490" fill="url(#strapBlack)" />
    <!-- Far Right Vertical Rubber Badge 'wallPen' -->
    <g transform="translate(1740, 680) rotate(-90)">
      <rect x="-80" y="-24" width="160" height="48" rx="24" fill="#111317" stroke="#4d5564" stroke-width="3" />
      <rect x="-74" y="-18" width="148" height="36" rx="18" fill="#181b21" />
      <text x="0" y="8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="23" fill="#757e90" text-anchor="middle" letter-spacing="-0.5">wallPen</text>
    </g>
  </g>

  <!-- [Bag 4] FOREGROUND LEFT RECTANGULAR HERO CASE -->
  <g id="bag-foreground-left">
    <!-- Top Carry Handles -->
    <path d="M 210 520 C 210 320, 390 320, 390 520" fill="none" stroke="#13161a" stroke-width="34" stroke-linecap="round" />
    <path d="M 210 520 C 210 330, 390 330, 390 520" fill="none" stroke="#525b6a" stroke-width="10" stroke-linecap="round" opacity="0.8" />
    
    <!-- Shoulder Strap Buckle Clip (Left Side) -->
    <path d="M 125 580 C 125 615, 155 615, 155 580 Z" fill="none" stroke="url(#metalChrome)" stroke-width="7" />
    <rect x="110" y="605" width="40" height="340" rx="10" fill="url(#strapBlack)" transform="rotate(22 130 605)" />
    
    <!-- Main 3D Box Body -->
    <rect x="80" y="520" width="490" height="455" rx="22" fill="url(#nylonHeroFront)" stroke="#6a7485" stroke-width="3.5" />
    
    <!-- Top Zipper Rim -->
    <rect x="78" y="520" width="494" height="46" rx="14" fill="#2d333e" stroke="#727d8f" stroke-width="2" />
    <line x1="80" y1="566" x2="570" y2="566" stroke="#111317" stroke-width="6" />
    
    <!-- Vertical Straps -->
    <rect x="190" y="520" width="46" height="455" fill="url(#strapBlack)" />
    <rect x="370" y="520" width="46" height="455" fill="url(#strapBlack)" />
    
    <!-- Heavy Stitching Detail Lines -->
    <line x1="193" y1="520" x2="193" y2="975" stroke="#485160" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="233" y1="520" x2="233" y2="975" stroke="#485160" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="373" y1="520" x2="373" y2="975" stroke="#485160" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="413" y1="520" x2="413" y2="975" stroke="#485160" stroke-width="1.5" stroke-dasharray="4,4" />

    <!-- Handle Anchor Plates -->
    <rect x="185" y="540" width="56" height="65" rx="6" fill="#13161a" stroke="#505969" stroke-width="2" />
    <rect x="365" y="540" width="56" height="65" rx="6" fill="#13161a" stroke="#505969" stroke-width="2" />

    <!-- Prominent 'wallPen' Vertical Rubber Badge on Front Right -->
    <g transform="translate(470, 785) rotate(-90)">
      <rect x="-85" y="-26" width="170" height="52" rx="26" fill="#111317" stroke="#687385" stroke-width="3.5" />
      <rect x="-78" y="-19" width="156" height="38" rx="19" fill="#1c1f26" />
      <text x="0" y="9" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="25" fill="#a5b0c2" text-anchor="middle" letter-spacing="-0.5">wallPen</text>
    </g>
  </g>

  <!-- [Bag 5] FOREGROUND RIGHT-CENTER DUFFEL BAG -->
  <g id="bag-foreground-right">
    <!-- Top Carry Handles -->
    <path d="M 1120 580 C 1120 380, 1340 380, 1340 580" fill="none" stroke="#13161a" stroke-width="32" stroke-linecap="round" />
    <path d="M 1120 580 C 1120 390, 1340 390, 1340 580" fill="none" stroke="#505868" stroke-width="9" stroke-linecap="round" opacity="0.75" />

    <!-- Duffel Body -->
    <rect x="1000" y="580" width="550" height="300" rx="20" fill="url(#nylonHeroFront)" stroke="#667081" stroke-width="3.5" />
    <rect x="998" y="580" width="554" height="42" rx="14" fill="#2c323c" stroke="#6c7789" stroke-width="2" />
    <line x1="1000" y1="622" x2="1550" y2="622" stroke="#111317" stroke-width="5" />

    <!-- Vertical Webbing Straps -->
    <rect x="1100" y="580" width="44" height="300" fill="url(#strapBlack)" />
    <rect x="1320" y="580" width="44" height="300" fill="url(#strapBlack)" />

    <!-- Side Strap D-Ring Hook on Right End -->
    <path d="M 1552 740 C 1572 740, 1572 765, 1552 765" fill="none" stroke="url(#metalChrome)" stroke-width="6" />

    <!-- Prominent 'wallPen' Vertical Rubber Badge on Front Right -->
    <g transform="translate(1415, 780) rotate(-90)">
      <rect x="-80" y="-24" width="160" height="48" rx="24" fill="#111317" stroke="#687385" stroke-width="3.5" />
      <rect x="-73" y="-17" width="146" height="34" rx="17" fill="#1c1f26" />
      <text x="0" y="8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="24" fill="#a5b0c2" text-anchor="middle" letter-spacing="-0.5">wallPen</text>
    </g>
  </g>

  <!-- Ambient Cinema Vignette & Studio Lighting Overlay -->
  <radialGradient id="vignette" cx="50%" cy="45%" r="60%">
    <stop offset="0%" stop-color="#000000" stop-opacity="0.10" />
    <stop offset="65%" stop-color="#000000" stop-opacity="0.38" />
    <stop offset="100%" stop-color="#000000" stop-opacity="0.80" />
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#vignette)" />

  <!-- ============================================================ -->
  <!-- 3. CENTER EXACT BRAND LOGO & TYPOGRAPHY: wallPen KOREA      -->
  <!-- ============================================================ -->
  <g transform="translate(960, 480)" text-anchor="middle" filter="url(#logoCenterShadow)">
    <!-- Bold Modern 'wallPen' Wordmark -->
    <text x="0" y="0" 
          font-family="'Plus Jakarta Sans', 'Arial Black', -apple-system, sans-serif" 
          font-weight="900" 
          font-size="192" 
          fill="#ffffff" 
          letter-spacing="-2">
      wallPen
    </text>

    <!-- 'K O R E A' with Wide Spacing -->
    <text x="0" y="105" 
          font-family="'Plus Jakarta Sans', 'Arial', sans-serif" 
          font-weight="800" 
          font-size="44" 
          fill="#ffffff" 
          letter-spacing="28">
      K O R E A
    </text>

    <!-- Subtitle '벽면 프린트 서비스 / 장비판매' -->
    <text x="0" y="175" 
          font-family="'Pretendard', 'Noto Sans KR', sans-serif" 
          font-weight="700" 
          font-size="30" 
          fill="#ffffff" 
          letter-spacing="3">
      벽면 프린트 서비스 / 장비판매
    </text>
  </g>
</svg>